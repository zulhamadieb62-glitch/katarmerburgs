<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pengurus - KATAR RW 08</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8">
        
        <!-- Header / Logo -->
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center mx-auto mb-3">
                <i data-lucide="lock" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Login Admin KATAR</h1>
            <p class="text-xs text-gray-500 mt-1">Masuk untuk mengelola agenda dan galeri kegiatan RW 08</p>
        </div>

        <!-- Alert Notifikasi Error/Sukses -->
        <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs font-medium border"></div>

        <!-- Form Login -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            
            <!-- Input Username / Email -->
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Username / Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </span>
                    <input type="text" id="username" required placeholder="Masukkan username / email" 
                        class="w-full pl-9 pr-3 py-2.5 text-sm border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                </div>
            </div>

            <!-- Input Password -->
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i data-lucide="key-round" class="w-4 h-4"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full pl-9 pr-10 py-2.5 text-sm border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                    <!-- Toggle Show/Hide Password -->
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                        <i data-lucide="eye" id="eyeIcon" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Tombol Submit -->
            <button type="submit" id="btnLogin" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-2 mt-2">
                <span>Masuk Ke Dashboard</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>

        </form>

        <!-- Link Kembali -->
        <div class="mt-6 text-center border-t border-gray-100 pt-4">
            <a href="index.html" class="text-xs text-gray-500 hover:text-emerald-600 font-medium inline-flex items-center gap-1">
                <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
                Kembali ke Halaman Utama
            </a>
        </div>

    </div>

    <!-- SCRIPT 1: Fungsi UI Biasa (Global Scope) -->
    <script>
        // Inisialisasi ikon Lucide
        lucide.createIcons();

        // Fitur Intip/Sembunyi Password
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwdInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }
    </script>

    <!-- SCRIPT 2: Integrasi Firebase Auth (ES Module) -->
    <script type="module">
        import { auth } from "./firebase-config.js";
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Mendaftarkan fungsi handleLogin ke ruang lingkup global window
        window.handleLogin = async function(event) {
            event.preventDefault();
            
            const email = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');
            const btnLogin = document.getElementById('btnLogin');

            alertBox.className = "hidden";
            btnLogin.disabled = true;
            btnLogin.innerHTML = `<span>Memverifikasi Firebase...</span>`;

            try {
                // Verifikasi via Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                
                alertBox.className = "mb-4 p-3 rounded-lg text-xs font-medium border bg-emerald-50 text-emerald-700 border-emerald-200 block";
                alertBox.innerText = "Login Berhasil! Mengalihkan...";

                setTimeout(() => {
                    window.location.href = "admin.html";
                }, 1000);

            } catch (error) {
                console.error("Login Error:", error);
                alertBox.className = "mb-4 p-3 rounded-lg text-xs font-medium border bg-red-50 text-red-700 border-red-200 block";
                alertBox.innerText = "Email atau Password Firebase salah!";
                
                btnLogin.disabled = false;
                btnLogin.innerHTML = `<span>Masuk Ke Dashboard</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
                lucide.createIcons();
            }
        };
    </script>
</body>
</html>
