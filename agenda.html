    <script>
        lucide.createIcons();

        // Toggle Sidebar Menu
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
                
            sidebar.classList.toggle('-translate-x-full');
                
               if (overlay.classList.contains('hidden')) {
                overlay.classList.remove('hidden');
            } else {
                  overlay.classList.add('hidden');
             }
         }

        //Sort Agenda
        function sortAgenda() {
            const container = document.getElementById('agenda-container');
            if (!container) return;

            // 1. Ambil semua elemen item agenda sebagai array
            const items = Array.from(container.querySelectorAll('.agenda-item'));

            // 2. Urutkan item berdasarkan nilai atribut data-date (Ascending / Dari terdekat)
            items.sort((a, b) => {
                const dateA = new Date(a.getAttribute('data-date'));
                const dateB = new Date(b.getAttribute('data-date'));
                return dateA - dateB; // Untuk terurut dari yang paling dekat -> terjauh
            });

            // 3. Masukkan kembali item yang sudah terurut ke dalam container HTML
            items.forEach(item => container.appendChild(item));
        }

            // Jalankan pengurutan otomatis saat halaman pertama kali dibuka
            document.addEventListener('DOMContentLoaded', sortAgenda);

            function filterGallery(category, btnElement) {
                // 1. Ambil semua tombol filter dan item agenda
                const filterButtons = document.querySelectorAll('.filter-btn');
                const agendaItems = document.querySelectorAll('[data-category]');

                // 2. Reset tampilan semua tombol menjadi gaya tombol tidak aktif (bg-white)
                filterButtons.forEach(btn => {
                    btn.classList.remove('bg-emerald-700', 'text-white');
                    btn.classList.add('bg-white', 'text-gray-600');
                });

                // 3. Aktifkan tombol yang sedang diklik (bg-emerald-700)
                if (btnElement) {
                    btnElement.classList.remove('bg-white', 'text-gray-600');
                    btnElement.classList.add('bg-emerald-700', 'text-white');
                }

                // 4. Sembunyikan atau tampilkan item agenda berdasarkan data-category
                agendaItems.forEach(item => {
                    const itemCategory = item.getAttribute('data-category');
                    
                    if (category === 'semua' || itemCategory === category) {
                        item.style.display = 'flex'; // Atau 'block' sesuai dengan layout card kamu
                    } else {
                        item.style.display = 'none';
                    }

                // URL Web App Google Apps Script Kamu
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzojwERUTe7oUEiTAMXlRxNk8nwnYJWivI-d4mICf8O9iXReuMYpK28bHJsxd13EvXp/exec";

        document.addEventListener("DOMContentLoaded", fetchAgendaData);

        async function fetchAgendaData() {
            const container = document.getElementById("agenda-container");
            
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getAgenda`);
                const result = await response.json();

                if (result.status === "success" && result.data.length > 0) {
                    renderAgenda(result.data);
                } else {
                    container.innerHTML = `<p class="text-center text-gray-500 py-8">Belum ada agenda kegiatan saat ini.</p>`;
                }
            } catch (error) {
                console.error("Error fetching agenda:", error);
                container.innerHTML = `<p class="text-center text-red-500 py-8">Gagal memuat agenda kegiatan.</p>`;
            }
        }

        function renderAgenda(data) {
            const container = document.getElementById("agenda-container");
            
            // Pemetaan Bulan Singkat Bahasa Indonesia
            const months = ["JAN", "FEB", "MAR", "APR", "MEI", "JUN", "JUL", "AGU", "SEP", "OKT", "NOV", "DES"];

            container.innerHTML = data.map(item => {
                // item[0]: ID, item[1]: Judul, item[2]: Tanggal (YYYY-MM-DD), item[3]: Kategori
                // item[4]: Waktu, item[5]: Lokasi, item[6]: Deskripsi
                
                const dateObj = new Date(item[2]);
                const day = isNaN(dateObj.getDate()) ? "--" : String(dateObj.getDate()).padStart(2, '0');
                const month = isNaN(dateObj.getMonth()) ? "---" : months[dateObj.getMonth()];

                return `
                    <div class="agenda-item bg-white p-5 rounded-2xl border border-emerald-500 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex items-start space-x-4">
                            <!-- Tanggal & Bulan -->
                            <div class="bg-emerald-100 text-emerald-800 p-3 rounded-xl text-center min-w-[60px]">
                                <span class="block font-bold text-xl leading-none">${day}</span>
                                <span class="text-xs uppercase tracking-wider font-semibold">${month}</span>
                            </div>
                            
                            <!-- Detail Agenda -->
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xs font-medium px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded">${item[3] || 'Umum'}</span>
                                </div>
                                <h3 class="font-bold text-gray-800 text-lg">${item[1]}</h3>
                                <p class="text-xs text-gray-500 mt-1">${item[6] || ''}</p>
                                <div class="flex flex-wrap items-center gap-4 text-xs text-gray-400 mt-2">
                                    <span>🕒 ${item[4] || '-'}</span>
                                    <span>📍 ${item[5] || '-'}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join("");
        }
