<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Karang Taruna</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Mencegah konten muncul sekejap sebelum Firebase selesai mengecek auth */
        body { display: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- NAVBAR -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-3">
                    <div class="p-2 bg-emerald-100 text-emerald-600 rounded-lg">
                        <i data-lucide="shield-check" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-gray-900 leading-tight">Admin Dashboard</h1>
                        <p class="text-xs text-gray-500">Panel Kelola Agenda & Galeri</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="text-right hidden sm:block">
                        <p id="adminName" class="text-sm font-semibold text-gray-800">Memuat...</p>
                        <p class="text-xs text-emerald-600 font-medium">Administrator</p>
                    </div>
                    <button id="btnLogout" class="p-2 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Logout">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-10">

        <!-- KELOLA AGENDA -->
        <section class="space-y-6">
            <div class="flex items-center justify-between border-b pb-4 border-gray-200">
                <div class="flex items-center space-x-2">
                    <i data-lucide="calendar" class="w-5 h-5 text-emerald-600"></i>
                    <h2 class="text-xl font-bold text-gray-800">Manajemen Agenda Kegiatan</h2>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Form Agenda -->
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm h-fit">
                    <h3 class="text-md font-semibold text-gray-800 mb-4 flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-600"></i> Form Agenda
                    </h3>
                    <form id="formAgenda" class="space-y-4">
                        <input type="hidden" id="agenda_id">
                        
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Judul Kegiatan</label>
                            <input type="text" id="agenda_judul" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Tanggal</label>
                                <input type="date" id="agenda_tanggal" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Kategori</label>
                                <input type="text" id="agenda_kategori" placeholder="misal: Sosial" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Waktu</label>
                                <input type="text" id="agenda_waktu" placeholder="08:00 - Selesai" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Lokasi</label>
                                <input type="text" id="agenda_lokasi" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Deskripsi</label>
                            <textarea id="agenda_deskripsi" rows="3" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                        </div>

                        <div class="flex gap-2 pt-2">
                            <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm transition-colors flex justify-center items-center gap-1">
                                <i data-lucide="save" class="w-4 h-4"></i> <span id="btnTextAgenda">Simpan Agenda</span>
                            </button>
                            <button type="button" onclick="resetFormAgenda()" class="px-3 py-2 border text-gray-600 hover:bg-gray-100 rounded-lg text-sm">Reset</button>
                        </div>
                    </form>
                </div>

                <!-- Tabel Agenda -->
                <div class="lg:col-span-2 bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden flex flex-col">
                    <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                        <h3 class="text-sm font-semibold text-gray-700">Daftar Agenda</h3>
                        <button onclick="loadAgendaData()" class="text-xs text-emerald-600 hover:underline flex items-center gap-1">
                            <i data-lucide="refresh-cw" class="w-3 h-3"></i> Refresh
                        </button>
                    </div>
                    <div class="overflow-x-auto flex-1">
                        <table class="w-full text-left text-sm text-gray-600">
                            <thead class="bg-gray-100 text-xs uppercase text-gray-500 border-b">
                                <tr>
                                    <th class="p-3">Tanggal</th>
                                    <th class="p-3">Judul</th>
                                    <th class="p-3">Kategori</th>
                                    <th class="p-3">Lokasi</th>
                                    <th class="p-3 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tableAgendaBody" class="divide-y divide-gray-100">
                                <tr><td colspan="5" class="p-4 text-center text-gray-400">Memuat data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <hr class="border-gray-200">

        <!-- KELOLA GALERI -->
        <section class="space-y-6">
            <div class="flex items-center justify-between border-b pb-4 border-gray-200">
                <div class="flex items-center space-x-2">
                    <i data-lucide="image" class="w-5 h-5 text-blue-600"></i>
                    <h2 class="text-xl font-bold text-gray-800">Manajemen Galeri & Dokumentasi</h2>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Form Galeri -->
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm h-fit">
                    <h3 class="text-md font-semibold text-gray-800 mb-4 flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-4 h-4 text-blue-600"></i> Form Dokumentasi
                    </h3>
                    <form id="formGaleri" class="space-y-4">
                        <input type="hidden" id="galeri_id">
                        
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Judul / Kegiatan</label>
                            <input type="text" id="galeri_judul" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Kategori</label>
                            <input type="text" id="galeri_kategori" placeholder="misal: Kerja Bakti" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">URL Gambar (Google Drive/Imgur/dsb)</label>
                            <input type="url" id="galeri_url" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://...">
                        </div>

                        <div class="flex gap-2 pt-2">
                            <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition-colors flex justify-center items-center gap-1">
                                <i data-lucide="save" class="w-4 h-4"></i> <span id="btnTextGaleri">Simpan Foto</span>
                            </button>
                            <button type="button" onclick="resetFormGaleri()" class="px-3 py-2 border text-gray-600 hover:bg-gray-100 rounded-lg text-sm">Reset</button>
                        </div>
                    </form>
                </div>

                <!-- Tabel Galeri -->
                <div class="lg:col-span-2 bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden flex flex-col">
                    <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                        <h3 class="text-sm font-semibold text-gray-700">Daftar Foto Dokumentasi</h3>
                        <button onclick="loadGaleriData()" class="text-xs text-blue-600 hover:underline flex items-center gap-1">
                            <i data-lucide="refresh-cw" class="w-3 h-3"></i> Refresh
                        </button>
                    </div>
                    <div class="overflow-x-auto flex-1">
                        <table class="w-full text-left text-sm text-gray-600">
                            <thead class="bg-gray-100 text-xs uppercase text-gray-500 border-b">
                                <tr>
                                    <th class="p-3">Preview</th>
                                    <th class="p-3">Judul</th>
                                    <th class="p-3">Kategori</th>
                                    <th class="p-3 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tableGaleriBody" class="divide-y divide-gray-100">
                                <tr><td colspan="4" class="p-4 text-center text-gray-400">Memuat data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- FIREBASE AUTHENTICATION (MODULE) -->
    <script type="module">
        // 1. Import 'auth' dari file config yang sama persis
        import { auth } from "./firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 2. Gunakan Listener Auth
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User benar-benar aktif / terautentikasi
                document.body.style.display = "flex";
                document.getElementById("adminName").innerText = user.displayName || user.email.split('@')[0];
                
                // Inisialisasi ikon & load data aman dengan pengecekan ketersediaan fungsi
                if (window.lucide) lucide.createIcons();
                if (typeof window.loadAgendaData === "function") window.loadAgendaData();
                if (typeof window.loadGaleriData === "function") window.loadGaleriData();
            } else {
                // Jika benar-benar tidak ada user, lempar ke login
                window.location.href = "login.html";
            }
        });

        // Event Logout
        document.getElementById("btnLogout")?.addEventListener("click", () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            }).catch((err) => {
                alert("Gagal logout: " + err.message);
            });
        });
    </script>

    <!-- LOGIKA APPS SCRIPT (AGENDA & GALERI) -->
    <script>
        // URL WEB APP APPS SCRIPT UNTUK CRUD DATA GOOGLE SHEETS
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyv6-9RZMe51Zr1S4qLkVqobR_z9qN1_-pJVxOdX9kVM4vQLN-VU84RyO6lVgqsj9E/exec";

        let localAgendaList = [];
        let localGaleriList = [];

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("formAgenda").addEventListener("submit", handleSaveAgenda);
            document.getElementById("formGaleri").addEventListener("submit", handleSaveGaleri);
        });

        // =========================================
        // MANAJEMEN AGENDA
        // =========================================
        async function loadAgendaData() {
            const tableBody = document.getElementById("tableAgendaBody");
            tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">Memuat data...</td></tr>`;
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAgenda`);
                const result = await res.json();
                
                if(result.status === "success") {
                    localAgendaList = result.data;
                    renderAgendaTable(localAgendaList);
                }
            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Gagal memuat data agenda.</td></tr>`;
            }
        }

        function renderAgendaTable(data) {
            const tableBody = document.getElementById("tableAgendaBody");
            if(!data || data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">Belum ada agenda tersimpan.</td></tr>`;
                return;
            }

            tableBody.innerHTML = data.map(item => `
                <tr class="hover:bg-gray-50">
                    <td class="p-3 font-medium text-gray-800">${item[2]}</td>
                    <td class="p-3">${item[1]}</td>
                    <td class="p-3"><span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded text-xs font-semibold">${item[3]}</span></td>
                    <td class="p-3">${item[5]}</td>
                    <td class="p-3 text-center space-x-2">
                        <button onclick="editAgenda('${item[0]}')" class="text-blue-600 hover:text-blue-800 font-medium text-xs">Edit</button>
                        <button onclick="deleteAgenda('${item[0]}')" class="text-red-600 hover:text-red-800 font-medium text-xs">Hapus</button>
                    </td>
                </tr>
            `).join("");
        }

        async function handleSaveAgenda(e) {
            e.preventDefault();
            const id = document.getElementById("agenda_id").value;
            const action = id ? "editAgenda" : "addAgenda";

            const payload = {
                action: action,
                id: id,
                judul: document.getElementById("agenda_judul").value,
                tanggal: document.getElementById("agenda_tanggal").value,
                kategori: document.getElementById("agenda_kategori").value,
                waktu: document.getElementById("agenda_waktu").value,
                lokasi: document.getElementById("agenda_lokasi").value,
                deskripsi: document.getElementById("agenda_deskripsi").value
            };

            await sendPostRequest(payload);
            resetFormAgenda();
            loadAgendaData();
        }

        function editAgenda(id) {
            const item = localAgendaList.find(a => String(a[0]) === String(id));
            if(!item) return;

            document.getElementById("agenda_id").value = item[0];
            document.getElementById("agenda_judul").value = item[1];
            document.getElementById("agenda_tanggal").value = item[2];
            document.getElementById("agenda_kategori").value = item[3];
            document.getElementById("agenda_waktu").value = item[4];
            document.getElementById("agenda_lokasi").value = item[5];
            document.getElementById("agenda_deskripsi").value = item[6];

            document.getElementById("btnTextAgenda").innerText = "Update Agenda";
        }

        async function deleteAgenda(id) {
            if(confirm("Apakah Anda yakin ingin menghapus agenda ini?")) {
                await sendPostRequest({ action: "deleteAgenda", id: id });
                loadAgendaData();
            }
        }

        function resetFormAgenda() {
            document.getElementById("formAgenda").reset();
            document.getElementById("agenda_id").value = "";
            document.getElementById("btnTextAgenda").innerText = "Simpan Agenda";
        }

        // =========================================
        // MANAJEMEN GALERI
        // =========================================
        async function loadGaleriData() {
            const tableBody = document.getElementById("tableGaleriBody");
            tableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">Memuat foto...</td></tr>`;
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getDokumentasi`);
                const result = await res.json();
                
                if(result.status === "success") {
                    localGaleriList = result.data;
                    renderGaleriTable(localGaleriList);
                }
            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Gagal memuat galeri.</td></tr>`;
            }
        }

        function renderGaleriTable(data) {
            const tableBody = document.getElementById("tableGaleriBody");
            if(!data || data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">Belum ada foto tersimpan.</td></tr>`;
                return;
            }

            tableBody.innerHTML = data.map(item => `
                <tr class="hover:bg-gray-50">
                    <td class="p-3"><img src="${item[3]}" class="w-12 h-12 object-cover rounded-lg border" alt="preview"></td>
                    <td class="p-3 font-medium text-gray-800">${item[1]}</td>
                    <td class="p-3"><span class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded text-xs font-semibold">${item[2]}</span></td>
                    <td class="p-3 text-center space-x-2">
                        <button onclick="editGaleri('${item[0]}')" class="text-blue-600 hover:text-blue-800 font-medium text-xs">Edit</button>
                        <button onclick="deleteGaleri('${item[0]}')" class="text-red-600 hover:text-red-800 font-medium text-xs">Hapus</button>
                    </td>
                </tr>
            `).join("");
        }

        async function handleSaveGaleri(e) {
            e.preventDefault();
            const id = document.getElementById("galeri_id").value;
            const action = id ? "editDokumentasi" : "addDokumentasi";

            const payload = {
                action: action,
                id: id,
                judul: document.getElementById("galeri_judul").value,
                kategori: document.getElementById("galeri_kategori").value,
                url_foto: document.getElementById("galeri_url").value
            };

            await sendPostRequest(payload);
            resetFormGaleri();
            loadGaleriData();
        }

        function editGaleri(id) {
            const item = localGaleriList.find(g => String(g[0]) === String(id));
            if(!item) return;

            document.getElementById("galeri_id").value = item[0];
            document.getElementById("galeri_judul").value = item[1];
            document.getElementById("galeri_kategori").value = item[2];
            document.getElementById("galeri_url").value = item[3];

            document.getElementById("btnTextGaleri").innerText = "Update Foto";
        }

        async function deleteGaleri(id) {
            if(confirm("Apakah Anda yakin ingin menghapus foto ini?")) {
                await sendPostRequest({ action: "deleteDokumentasi", id: id });
                loadGaleriData();
            }
        }

        function resetFormGaleri() {
            document.getElementById("formGaleri").reset();
            document.getElementById("galeri_id").value = "";
            document.getElementById("btnTextGaleri").innerText = "Simpan Foto";
        }

        // =========================================
        // HELPER API REQUEST (Mencegah CORS Issue)
        // =========================================
        async function sendPostRequest(payload) {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8",
                    },
                    body: JSON.stringify(payload)
                });
                const res = await response.json();
                alert(res.message || "Berhasil memproses data!");
            } catch (err) {
                console.error(err);
                alert("Gagal memproses permintaan.");
            }
        }
    </script>
</body>
</html>
